# iris.bavariaduo.ovh — TLS reverse proxy in front of the phone API.
#
# Install to /etc/nginx/sites-available/iris and symlink into sites-enabled.
# The certificate is issued by acme.sh over OVH DNS-01 (see scripts/setup-tls.sh);
# the name resolves only on the LAN, via an Unbound host override in OPNsense, so
# nothing here is reachable from the internet.

server {
    listen      80;
    listen      [::]:80;
    server_name iris.bavariaduo.ovh;

    # No ACME HTTP-01 exception is needed: validation is DNS-01, so port 80 exists
    # only to bounce anyone who typed the name without a scheme.
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name iris.bavariaduo.ovh;

    ssl_certificate     /etc/ssl/iris/fullchain.pem;
    ssl_certificate_key /etc/ssl/iris/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The board is reached by name over TLS only. No preload, no includeSubDomains:
    # this is one host in a zone that has other, unrelated services in it.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "same-origin"      always;

    # Greeting uploads go through PUT /api/audio/files/<name>.
    client_max_body_size 32m;

    access_log /var/log/nginx/iris.access.log;
    error_log  /var/log/nginx/iris.error.log;

    # --- Server-Sent Events -------------------------------------------------
    # /api/events is a long-lived stream. With nginx's default buffering it looks
    # like a hang and the UI's live updates stop without any error being shown,
    # so buffering must be off and the read timeout must outlast an idle stream.
    location = /api/events {
        proxy_pass            http://127.0.0.1:8080;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    24h;
        chunked_transfer_encoding off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- everything else ----------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # X-Forwarded-Proto is not cosmetic here: Flask sets a Secure session
        # cookie, and without ProxyFix seeing this header it believes the request
        # arrived over plain HTTP and the browser silently discards the cookie.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mode switching (AT+CFUN=1,1 and the SMS/voice domain changes) blocks for
        # ~40 s and can exceed a minute while the modem re-enumerates. The 60 s
        # default would cut those requests off mid-operation.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
